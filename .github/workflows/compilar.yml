name: Compilar Windows y Mac
on:
  push:
    branches: [main, 'worktree-*']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: cmd
        run: |
          cd windows
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /optimize+ /target:winexe /platform:anycpu /out:AutoPrision2026.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll AutoPrision.cs
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory paquete | Out-Null
          Copy-Item windows/AutoPrision2026.exe, windows/LEEME-WINDOWS.txt paquete/
          Compress-Archive -Path paquete/* -DestinationPath AutoPrision2026-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPrision2026-Windows
          path: AutoPrision2026-Windows.zip
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh mac/compilar-mac.sh
      - name: Empaquetar
        run: |
          mkdir paquete
          ditto "mac/AutoPrision 2026.app" "paquete/AutoPrision 2026.app"
          cp mac/LEEME-MAC.txt paquete/
          ditto -c -k --keepParent paquete AutoPrision2026-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPrision2026-Mac
          path: AutoPrision2026-Mac.zip
  linux:
    runs-on: ubuntu-22.04 # glibc 2.35: vale para Ubuntu 22.04+, Debian 12+, Fedora, Arch y SteamOS
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxtst-dev xvfb xdotool imagemagick
      - run: sh linux/compilar-linux.sh
      - name: Autotest
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./linux/autoprision2026 --autotest
      - name: Prueba de grabar y reproducir
        run: xvfb-run -a -s "-screen 0 1280x800x24" sh linux/prueba-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-linux
          path: linux/captura.png
      - name: Empaquetar
        run: |
          mkdir AutoPrision2026-Linux
          cp linux/autoprision2026 linux/LEEME-LINUX.txt linux/instalar.sh AutoPrision2026-Linux/
          chmod +x AutoPrision2026-Linux/autoprision2026 AutoPrision2026-Linux/instalar.sh
          tar czf AutoPrision2026-Linux.tar.gz AutoPrision2026-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPrision2026-Linux
          path: AutoPrision2026-Linux.tar.gz
  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Crear la versión con los dos ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AutoPrision2026-Windows.zip AutoPrision2026-Mac.zip AutoPrision2026-Linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "AutoPrisión 2026 $GITHUB_REF_NAME" \
            --notes "Descarga el archivo de tu sistema: Windows, Mac o Linux. Instrucciones dentro (LEEME)."
