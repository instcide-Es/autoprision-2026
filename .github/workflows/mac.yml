name: Compilar para Mac
on:
  push:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh compilar-mac.sh
      - run: |
          mkdir paquete
          ditto "AutoPrision 2026.app" "paquete/AutoPrision 2026.app"
          cp LEEME-MAC.txt paquete/
          ditto -c -k --keepParent paquete AutoPrision2026-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPrision2026-Mac
          path: AutoPrision2026-Mac.zip
